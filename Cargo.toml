[package]
name = "rustopus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Async HTTP request orchestration: per-API rate limiting, bounded concurrency, and pluggable retry policies."
repository = "https://github.com/nimanoori22/rustopus"
readme = "README.md"
keywords = ["http", "reqwest", "rate-limit", "retry", "async"]   # max 5, each ≤20 chars
categories = ["asynchronous", "network-programming"]

[dependencies]
reqwest   = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio     = { version = "1.53.1", features = ["sync", "time", "rt"] }
governor  = "0.10.4"
bytes     = "1.12.1"
http      = "1.5.0"
thiserror = "2.0.20"
tracing   = "0.1.44"
rand      = "0.10.3"       # backoff jitter

[dev-dependencies]
tokio              = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock           = "0.6.5"
tracing-subscriber = "0.3.23"
